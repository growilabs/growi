[project]
name = "attachment-text-extractor"
version = "0.1.0"
description = "GROWI attachment text extraction microservice"
requires-python = ">=3.12"
dependencies = [
    # HTTP framework and ASGI server (all MIT)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Multipart form parsing required by FastAPI for file upload endpoints (MIT)
    "python-multipart>=0.0.9",
    # Schema / settings (MIT)
    "pydantic>=2",
    "pydantic-settings>=2",
    # XML/HTML safety: prevents XXE and billion-laughs attacks when parsing
    # DOCX / XLSX / PPTX ZIP members. (MIT license — no GPL/AGPL transitive deps)
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # ASGI test client for FastAPI
    "ruff>=0.6",
    "poethepoet>=0.29",  # task runner (npm scripts equivalent for pyproject.toml)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
    "N",   # pep8-naming
]
ignore = [
    "S101",   # assert-used (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN"]  # relax security and annotation rules in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# Task runner (poethepoet) — invoke via `uv run poe <task>`
# ---------------------------------------------------------------------------
[tool.poe.tasks]
dev            = "uvicorn app.main:app --reload --port 8000"
test           = "pytest"
lint           = "ruff check ."
format         = "ruff format ."
format-check   = "ruff format --check ."
export-openapi = "python scripts/export_openapi.py --output ../../packages/attachment-text-extractor-client/openapi.json"
check          = ["lint", "format-check", "test"]
