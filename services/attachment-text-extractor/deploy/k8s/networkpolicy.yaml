# The service needs no outbound traffic (conversion is fully local, and anydoc
# hosted OCR is never used), so egress is denied by listing it with no rules.
# Kubelet probes are not affected by NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: attachment-text-extractor
  namespace: growi # EDIT: keep identical to deployment.yaml
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: attachment-text-extractor
  policyTypes:
    - Ingress
    - Egress
  egress: []
  ingress:
    - from:
        # EDIT: select the namespace and Pods of the GROWI app that calls this service.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: growi
          podSelector:
            matchLabels:
              app.kubernetes.io/name: growi-app
      ports:
        - protocol: TCP
          port: 8000
