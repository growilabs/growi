# CPU utilization is only a proxy: each Pod admits MAX_CONCURRENCY (3) conversions
# and answers 503 when all slots are busy, so a saturated Pod shows high CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: attachment-text-extractor
  namespace: growi # EDIT: keep identical to deployment.yaml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attachment-text-extractor
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Scaling down terminates Pods; keep the window long so bursts of indexing do not flap.
      stabilizationWindowSeconds: 300
