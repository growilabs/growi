name: Sync translations from POEditor (pull)

# Exports every namespace x non-source-language combination from POEditor,
# classifies each one as a translation-only or a structural change, and opens
# at most two pull requests from the result: one that the sync bot approves
# once the i18n gate passes, and one that waits for human review
# (Requirement 3.1, 3.2, 3.3, 3.4, 8.1).
#
# Trigger scope is schedule + manual only. Unlike the push workflow there is
# no repository content to react to -- the input lives in POEditor, so there
# is nothing to watch for; running on a timer, plus on demand, is the whole
# trigger surface (design.md PullTranslationSync Batch Contract).

on:
  schedule:
    # Daily at 21:00 UTC (06:00 JST), outside working hours so a sync pull
    # request is waiting at the start of the day rather than landing in the
    # middle of one.
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  # Grouped by workflow alone, not by ref: a scheduled or manually dispatched
  # run is not tied to a particular pushed ref the way the push workflow's
  # runs are, and both sync branches are fixed names shared by every run.
  group: ${{ github.workflow }}
  # Deliberately NOT cancel-in-progress, which is where this differs from
  # i18n-sync-push.yml. Push can cancel safely because each run uploads the
  # complete current en_US state, so a superseding run makes a cancelled one
  # redundant. Pull has no such argument: a run cancelled between the force
  # push and the approving review leaves an unapproved pull request that only
  # the next scheduled run repairs. Two overlapping runs converge on the same
  # POEditor state anyway, so queueing costs nothing and cancelling buys
  # nothing.
  cancel-in-progress: false

# The job's own GITHUB_TOKEN is no longer used for anything: checkout and the
# sync CLI both use the App-minted tokens below instead. Left at read-only
# rather than removed, so the default token stays available (e.g. to
# actions/checkout for internal bookkeeping) without granting it any write
# capability (design.md Security Considerations). This does NOT scope the
# publish/approval App tokens minted below: an installation token carries the
# permissions its App was granted, which no workflow key can narrow. The
# approval identity is limited to submitting approving reviews by (a) the
# approval App's own permission set (pull-requests: write only, no
# contents: write -- see docs/i18n-community-translation-setup.md) and (b) the
# code path in tools/i18n-sync/github-adapters.ts, where the approval token
# reaches exactly one endpoint (POST /pulls/{n}/reviews) and no adapter that
# holds it has any content-writing capability.
permissions:
  contents: read

jobs:
  i18n-sync-pull:
    runs-on: ubuntu-latest

    steps:
      # Two separate GitHub Apps, minted fresh on every run. Long-term
      # storage is the App private keys only -- never the installation
      # tokens themselves, which expire in under an hour. Splitting into two
      # Apps (rather than one) is what lets the approval step below avoid
      # GitHub's self-approval rejection: the PR is authored by the publish
      # App's identity, and the approving review comes from a genuinely
      # different identity (docs/i18n-community-translation-setup.md §4.2).
      - name: Mint publish app token
        id: mint-publish
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.I18N_SYNC_PUBLISH_APP_ID }}
          private-key: ${{ secrets.I18N_SYNC_PUBLISH_APP_PRIVATE_KEY }}

      - name: Mint approval app token
        id: mint-approval
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.I18N_SYNC_APPROVAL_APP_ID }}
          private-key: ${{ secrets.I18N_SYNC_APPROVAL_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          # The credential this token leaves behind is what `git push` uses,
          # so it also decides which identity the sync branches are pushed
          # under. This must be the publish App's token, not the workflow's
          # own GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not start
          # further workflow runs, so the translation-only pull request would
          # never get the `ci-app-lint` check that .github/mergify.yml's
          # queue conditions require, and would sit in the merge queue
          # forever. Deliberately no `|| secrets.GITHUB_TOKEN` fallback: a
          # missing private key must fail this step loudly, not degrade
          # silently into that unmergeable state.
          token: ${{ steps.mint-publish.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull translations from POEditor and open the sync pull requests
        working-directory: ./apps/app
        env:
          POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
          # The CLI's own env var names stay as-is; only where their values
          # come from has changed (minted above, not read from a fixed
          # secret). The approval token must never equal the publish token:
          # GitHub refuses a self-approval, and the CLI rejects the run
          # outright if the two match -- which two distinct Apps guarantee.
          I18N_SYNC_PUBLISH_TOKEN: ${{ steps.mint-publish.outputs.token }}
          I18N_SYNC_APPROVAL_TOKEN: ${{ steps.mint-approval.outputs.token }}
        run: pnpm run i18n:sync:pull
