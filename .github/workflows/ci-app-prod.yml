name: Node CI for app production

on:
  push:
    # This is an allowlist, so `flaky-repro/**` (throwaway measurement
    # branches pushed by .github/workflows/flaky-repro.yml) can never match
    # and is already excluded without needing `branches-ignore` (which
    # cannot be combined with `branches` on the same event). See design.md
    # "CI Exclusion" in .kiro/specs/ci-flaky-test-detection.
    branches:
      - master
      - dev/7.*.x
      - dev/8.*.x
    paths:
      - .github/mergify.yml
      - .github/workflows/ci-app-prod.yml
      - .github/workflows/reusable-app-prod.yml
      - tsconfig.base.json
      - turbo.json
      - pnpm-lock.yaml
      - package.json
      - apps/app/**
      - '!apps/app/docker/**'
      - packages/**
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/mergify.yml
      - .github/workflows/ci-app-prod.yml
      - .github/workflows/reusable-app-prod.yml
      - tsconfig.base.json
      - pnpm-lock.yaml
      - turbo.json
      - package.json
      - apps/app/**
      - '!apps/app/docker/**'
      - packages/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  test-prod-node24:
    uses: ./.github/workflows/reusable-app-prod.yml
    if: |
      ( github.event_name == 'push'
        || github.base_ref == 'master'
        || github.base_ref == 'dev/7.*.x'
        || github.base_ref == 'dev/8.*.x'
        || startsWith( github.base_ref, 'release/' )
        || startsWith( github.head_ref, 'mergify/merge-queue/' ))
      # Skip heavy CI when `flag/skip-heavy-ci` is present, or when this is
      # the i18n sync bot's translation-only pull request. The head-ref
      # check (not just the label) matters because the label lands after
      # the PR's `opened` event via a separate API call -- the head ref,
      # unlike the label, is already final at `opened` time, so checking it
      # directly avoids a race that a `labeled` trigger would otherwise need
      # (and which risks cancelling an in-flight run into a `cancelled`
      # conclusion that Mergify's `check-failure` treats as a failure).
      && !( contains( github.event.pull_request.labels.*.name, 'flag/skip-heavy-ci' )
            || github.event.pull_request.head.ref == 'i18n-sync/translation-only' )
    with:
      node-version: 24.x
      skip-e2e-test: ${{ contains( github.event.pull_request.labels.*.name, 'dependencies' ) }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
