name: Flaky repro

# Measuring instrument for the flaky-test routine.
#
# The routine's execution environment has no `actions: write`, so it cannot
# re-run CI to decide whether a failure is non-deterministic. Instead it pushes
# a commit carrying a `Flaky-Repro-*` git trailer block, and this workflow runs
# the requested spec and reports the tally. The check-run conclusion says only
# whether the measurement could be taken:
#   success — the request was valid and the run happened (tests may have failed)
#   failure — the request was rejected or the setup broke; nothing was measured
#
# Contract: `Repro Request / Result` in .kiro/specs/ci-flaky-test-detection.
# The trailers must form ONE trailer block, i.e. the last paragraph of the head
# commit message.

on:
  push:
    branches:
      - flaky-repro/**
      - fix/flaky-**
  # No `pull_request` trigger on purpose: a fork must not be able to start this.

permissions:
  contents: read
  issues: write

jobs:
  # The job id is the check-run name the routine polls for. Do not add a
  # `strategy.matrix` here: that would rename the check-run to
  # `flaky-repro (<value>)` and the routine's exact-name lookup would miss it.
  flaky-repro:
    runs-on: ubuntu-latest
    # Sized to the worst shape this job takes: `suite` mode on the integration
    # projects (service startup + the full `test:integ` script). `file` mode,
    # which is what the routine actually uses, finishes in a few minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Parse and validate the repro request
        id: request
        run: |
          set -euo pipefail

          reject() {
            {
              echo "## Flaky repro request rejected"
              echo
              echo "$1"
              echo
              echo "Head commit: \`${GITHUB_SHA:-$(git log -1 --format=%H)}\`"
              echo
              echo '```'
              git log -1 --format=%B
              echo '```'
              echo
              echo "Expected trailer block, as the last paragraph of the commit message:"
              echo
              echo '```'
              echo "Flaky-Repro-Spec: <path under apps/app, e.g. src/server/util/foo.spec.ts>"
              echo "Flaky-Repro-Project: app-unit | app-components | app-integration | app-integration-exclusive"
              echo "Flaky-Repro-Mode: file | suite            # optional, default file"
              echo "Flaky-Repro-Repeat: <1-10>                # optional, default 3"
              echo "Flaky-Repro-Issue: <issue number>         # optional"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::flaky-repro: $1"
            exit 1
          }

          # Every trailer must sit in ONE trailer block, i.e. the LAST paragraph of the
          # commit message. `git commit -m a -m b` makes each -m its own paragraph, so
          # only the last one is read as a trailer block and the rest are silently
          # invisible here. Producers must pass the whole block as a single -m (or -F).
          # Result lands in TRAILER_VALUE: a plain return keeps `reject` in this shell,
          # where its `exit 1` actually stops the step.
          TRAILER_VALUE=''
          read_trailer() {
            local key="$1" value
            value="$(git log -1 --format="%(trailers:key=${key},valueonly)")"
            if [ "$(printf '%s\n' "$value" | wc -l)" -gt 1 ]; then
              reject "Trailer \`${key}\` appears more than once in the head commit. Give it exactly one value."
            fi
            # Strip surrounding whitespace so a stray trailing space is not a rejection.
            value="${value#"${value%%[![:space:]]*}"}"
            TRAILER_VALUE="${value%"${value##*[![:space:]]}"}"
          }

          read_trailer Flaky-Repro-Spec;    SPEC="$TRAILER_VALUE"
          read_trailer Flaky-Repro-Project; PROJECT="$TRAILER_VALUE"
          read_trailer Flaky-Repro-Mode;    MODE="$TRAILER_VALUE"
          read_trailer Flaky-Repro-Repeat;  REPEAT="$TRAILER_VALUE"
          read_trailer Flaky-Repro-Issue;   ISSUE="$TRAILER_VALUE"

          # A `fix/flaky-**` branch is an ordinary fix branch that happens to be named
          # after a flaky issue, and design.md keeps one case deliberately trailer-less:
          # a Playwright fix, whose verification is the `run-playwright` job that runs
          # once the PR enters the merge queue. reusable-app-prod.yml gates that job on
          # `head_ref` starting with `mergify/merge-queue/` (or on workflow_dispatch), so
          # it does NOT run when the PR is opened. Such a push is not a repro request at
          # all, so it is reported as "nothing to measure"
          # rather than as a rejected request — otherwise every Playwright fix PR would
          # carry a red `flaky-repro` check. A `flaky-repro/**` branch exists only to be
          # measured, so an empty request there is still an error.
          if [ -z "${SPEC}${PROJECT}${MODE}${REPEAT}${ISSUE}" ]; then
            case "${GITHUB_REF_NAME:-}" in
              fix/flaky-*)
                {
                  echo "## Flaky repro: nothing to measure"
                  echo
                  echo "The head commit of \`${GITHUB_REF_NAME}\` carries no \`Flaky-Repro-*\` trailer,"
                  echo "so no repro was requested."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "requested=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          MODE="${MODE:-file}"
          REPEAT="${REPEAT:-3}"

          # --- Flaky-Repro-Spec: mandatory, apps/app-relative, must exist ---------------
          [ -n "$SPEC" ] || reject "Trailer \`Flaky-Repro-Spec\` is missing."
          # The value is later handed to vitest as an argument. Restricting it to this
          # character set keeps it free of anything a shell or YAML expression could act
          # on, so no other layer has to re-sanitise it. Square brackets are in the set
          # because Next.js dynamic-route directories need them (src/pages/[[...path]]/);
          # they are glob characters, so every use of the value must stay quoted.
          if [[ ! $SPEC =~ ^[]A-Za-z0-9._/[-]+$ ]]; then
            reject "\`Flaky-Repro-Spec\` may only contain A-Z a-z 0-9 and . _ / - [ ] but was \`${SPEC}\`."
          fi
          case "$SPEC" in
            /*) reject "\`Flaky-Repro-Spec\` must be relative to \`apps/app\`, not an absolute path (\`${SPEC}\`)." ;;
            apps/app/*) reject "\`Flaky-Repro-Spec\` must be relative to \`apps/app\`. Drop the \`apps/app/\` prefix: \`${SPEC#apps/app/}\`." ;;
            ..|../*|*/..|*/../*) reject "\`Flaky-Repro-Spec\` must not leave \`apps/app\` (\`${SPEC}\`)." ;;
          esac
          [ -f "apps/app/${SPEC}" ] || reject "\`Flaky-Repro-Spec\` does not exist in this commit: \`apps/app/${SPEC}\`."

          # --- Flaky-Repro-Project: mandatory, allowlisted ------------------------------
          # Keep in sync with the vitest project names in apps/app/vitest.workspace.mts and
          # the test:* scripts in apps/app/package.json (Revalidation Trigger).
          [ -n "$PROJECT" ] || reject "Trailer \`Flaky-Repro-Project\` is missing."
          case "$PROJECT" in
            app-unit|app-components|app-integration|app-integration-exclusive) ;;
            *) reject "\`Flaky-Repro-Project\` must be one of app-unit, app-components, app-integration, app-integration-exclusive but was \`${PROJECT}\`." ;;
          esac

          # --- Flaky-Repro-Mode: optional, default file ---------------------------------
          case "$MODE" in
            file|suite) ;;
            *) reject "\`Flaky-Repro-Mode\` must be \`file\` or \`suite\` but was \`${MODE}\`." ;;
          esac

          # --- Flaky-Repro-Repeat: optional, default 3, 1..10 ---------------------------
          case "$REPEAT" in
            [1-9]|10) ;;
            *) reject "\`Flaky-Repro-Repeat\` must be an integer from 1 to 10 but was \`${REPEAT}\`." ;;
          esac

          # --- Flaky-Repro-Issue: optional, positive integer ----------------------------
          if [ -n "$ISSUE" ]; then
            case "$ISSUE" in
              0*|*[!0-9]*) reject "\`Flaky-Repro-Issue\` must be a positive issue number but was \`${ISSUE}\`." ;;
            esac
          fi

          {
            echo "requested=true"
            echo "spec=${SPEC}"
            echo "project=${PROJECT}"
            echo "mode=${MODE}"
            echo "repeat=${REPEAT}"
            echo "issue=${ISSUE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Flaky repro request"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Spec | \`${SPEC}\` |"
            echo "| Project | \`${PROJECT}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| Repeat | ${REPEAT} |"
            echo "| Issue | ${ISSUE:-none (the result stays in this summary only)} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------------------------------
      # Cross-reference: every step from here through "Wait for Elasticsearch
      # to be ready" is a copy of the setup steps of `ci-app-test-integration`
      # in ci-app.yml, so that a repro runs on the same toolchain as the CI job
      # whose failure it is reproducing.
      #
      # Revalidation Trigger (design.md in .kiro/specs/ci-flaky-test-detection):
      # when ci-app.yml changes the setup
      # actions, their versions, the Node version, or the dist cache key,
      # change this file in the same commit. Keep the matching cross-reference
      # comment in ci-app.yml pointing back here.
      #
      # Three deliberate differences:
      #
      # 1. The dist cache is restore-only here. Repro branches are throwaway
      #    and push often, so saving under the shared `dist-ci-app-*` key would
      #    churn the repository cache quota and evict ci-app.yml's own entries.
      #    The key and restore-keys stay identical so that this workflow still
      #    reads those entries.
      # 2. ci-app.yml fans its versions out over a `strategy.matrix`; this job
      #    must stay matrix-free (see the job comment above), so each version is
      #    pinned to one cell of that matrix — MongoDB 8.0 and the Elasticsearch
      #    8 cell. A repro therefore measures those two cells only.
      # 3. Elasticsearch starts only for the integration projects, because only
      #    they use it — see the comment on that step. Every other setup step
      #    runs for all four projects, as in ci-app.yml.
      # ----------------------------------------------------------------------
      #
      # Every step below is skipped when the push carried no repro request
      # (`requested=false`, see the validation step).
      - uses: pnpm/action-setup@v6
        if: steps.request.outputs.requested == 'true'

      - uses: actions/setup-node@v6
        if: steps.request.outputs.requested == 'true'
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Restore dist
        if: steps.request.outputs.requested == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            **/.turbo
            **/dist
            **/node_modules/.cache/turbo
          key: dist-ci-app-${{ runner.OS }}-node24.x-${{ github.sha }}
          restore-keys: |
            dist-ci-app-${{ runner.OS }}-node24.x-

      - name: Install dependencies
        if: steps.request.outputs.requested == 'true'
        run: |
          pnpm add turbo --global
          pnpm install --frozen-lockfile

      # MongoDB runs for every project, not just the integration ones: the CI
      # job that covers app-unit / app-components (`ci-app-test`) starts it too
      # and hands the tests a `MONGO_URI`. A self-contained spec prefers that
      # URI over an embedded mongodb-memory-server (see
      # apps/app/test/setup/mongo/self-contained-connection.ts), so a repro
      # without the service would exercise a different code path than the CI
      # failure it is reproducing — and would report a stable spec as failing.
      - name: Start MongoDB (replica set)
        if: steps.request.outputs.requested == 'true'
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: rs0

      # Elasticsearch, by contrast, is only ever used by the integration
      # projects (apps/app/test/setup/elasticsearch.ts is in their setupFiles
      # and nowhere else), so unit and component repros do not pay for starting
      # it.
      - name: Start Elasticsearch with plugins
        if: steps.request.outputs.requested == 'true' && startsWith(steps.request.outputs.project, 'app-integration')
        uses: elastic/elastic-github-actions/elasticsearch@master
        with:
          stack-version: '8.19.16'
          plugins: |
            analysis-kuromoji
            analysis-icu
          security-enabled: false

      - name: Wait for Elasticsearch to be ready
        if: steps.request.outputs.requested == 'true' && startsWith(steps.request.outputs.project, 'app-integration')
        run: |
          curl \
            --no-progress-meter \
            -X GET \
            --retry 60 \
            --retry-delay 1 \
            --retry-connrefused \
            http://localhost:9200/_cluster/health?wait_for_status=green

      - name: Build the prerequisites of the test script
        if: steps.request.outputs.requested == 'true'
        # Validated values are passed as environment variables, never
        # interpolated into the script body: a `${{ }}` expression is expanded
        # into the shell source before bash sees it, so its content would be
        # executable. Keep this shape when adding steps.
        env:
          PROJECT: ${{ steps.request.outputs.project }}
        run: |
          set -euo pipefail

          # ci-app.yml reaches the tests through `turbo run test:*`, which
          # builds these first. Here the tests are invoked directly (turbo would
          # cache a test result, and `file` mode needs a fresh process per run),
          # so the same generated artifacts have to be produced explicitly.
          # They are not optional: the dist cache is restore-only above, so on a
          # cache miss `**/dist` is empty and vitest cannot resolve `@growi/*`.
          #
          # Revalidation Trigger (design.md in .kiro/specs/ci-flaky-test-detection): keep in sync with the `dependsOn`
          # of the `test:*` tasks in apps/app/turbo.json. Check with
          # `turbo run test:unit --filter=@growi/app --dry-run`.

          # `^dev` — the dist of every workspace package apps/app depends on.
          turbo run dev --filter='@growi/app^...' --env-mode=loose

          case "$PROJECT" in
            app-components)
              turbo run dev:pre:styles-commons dev:pre:styles-components pre:styles-bulk-export \
                --filter=@growi/app --env-mode=loose
              ;;
            *)
              turbo run pre:styles-bulk-export --filter=@growi/app --env-mode=loose
              ;;
          esac

      - name: Run the repro and tally the results
        id: repro
        if: steps.request.outputs.requested == 'true'
        working-directory: apps/app
        env:
          SPEC: ${{ steps.request.outputs.spec }}
          PROJECT: ${{ steps.request.outputs.project }}
          MODE: ${{ steps.request.outputs.mode }}
          REPEAT: ${{ steps.request.outputs.repeat }}
          # Same values ci-app.yml gives its Test steps. The Elasticsearch pair
          # is set unconditionally because only the integration projects' setup
          # file reads it; for the others it is inert.
          MONGO_URI: mongodb://localhost:27017/growi_test?replicaSet=rs0
          VITE_ELASTICSEARCH_URI: http://localhost:9200/growi
          VITE_ELASTICSEARCH_VERSION: 8
        run: |
          set -euo pipefail

          LOG_DIR="${RUNNER_TEMP}/flaky-repro"
          mkdir -p "$LOG_DIR"

          # --- What one run is ---------------------------------------------
          case "$PROJECT" in
            app-unit)        SUITE_SCRIPT='test:unit' ;;
            app-components)  SUITE_SCRIPT='test:components' ;;
            app-integration|app-integration-exclusive) SUITE_SCRIPT='test:integ' ;;
            *)
              echo "::error::flaky-repro: no test script is mapped to project ${PROJECT}"
              exit 1
              ;;
          esac

          VITEST_ARGS=(run "--project=${PROJECT}")
          case "$PROJECT" in
            # Same fork cap as the `test:integ` script, so a repro contends for
            # the runner's CPUs the way the CI job does — that contention is
            # itself a source of the non-determinism being measured (#11752).
            app-integration|app-integration-exclusive)
              VITEST_ARGS+=(--poolOptions.forks.maxForks=4)
              ;;
          esac

          # `$SPEC` stays quoted everywhere: the allowlist permits `[` and `]`
          # for Next.js dynamic-route directories, which are glob characters.
          run_once() {
            case "$MODE" in
              file)  pnpm vitest "${VITEST_ARGS[@]}" "$SPEC" ;;
              suite) pnpm run "$SUITE_SCRIPT" ;;
            esac
          }

          # `suite` mode is one run of the whole project by definition; Repeat
          # only applies to `file` mode.
          if [ "$MODE" = 'suite' ]; then
            REPEAT=1
          fi

          # --- Run and tally -------------------------------------------------
          RUNS=0
          FAILED=0
          PER_RUN=''
          FIRST_FAILED_RUN=0

          for i in $(seq 1 "$REPEAT"); do
            LOG="${LOG_DIR}/run-${i}.log"
            RC=0
            # `if ! …` keeps a failing run from tripping `set -e`. Here a failed
            # test is the measurement, not an error: the job's conclusion says
            # only whether the measurement could be taken.
            if ! run_once > "$LOG" 2>&1; then
              RC=1
            fi
            echo "::group::flaky-repro run ${i}/${REPEAT}"
            cat "$LOG"
            echo "::endgroup::"

            # A first run that matched no test file measured nothing — which
            # happens when the spec exists but belongs to another project (an
            # `app-unit` request for a `*.spec.tsx`, say). Recording it as a
            # failure would read as "deterministic regression", so it fails the
            # job instead: nothing was measured.
            #
            # Only the first run is checked. Once one run has collected the
            # spec, the spec/project pairing is proven, and the same message
            # from a later run is a symptom of that run — counting it as `fail`
            # keeps the runs already measured instead of discarding them.
            if [ "$i" -eq 1 ] && grep -qF 'No test files found' "$LOG"; then
              {
                echo
                echo "### Flaky repro: nothing was measured"
                echo
                echo "vitest matched no test file for \`${SPEC}\` in project \`${PROJECT}\`."
                echo "Check that the spec belongs to that project (see apps/app/vitest.workspace.mts)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::flaky-repro: no test file matched ${SPEC} in project ${PROJECT}"
              exit 1
            fi

            RUNS=$((RUNS + 1))
            if [ "$RC" -eq 0 ]; then
              PER_RUN="${PER_RUN:+${PER_RUN}, }pass"
            else
              PER_RUN="${PER_RUN:+${PER_RUN}, }fail"
              FAILED=$((FAILED + 1))
              if [ "$FIRST_FAILED_RUN" -eq 0 ]; then
                FIRST_FAILED_RUN="$i"
              fi
            fi
          done

          # --- The failing run's excerpt -------------------------------------
          EXCERPT=''
          if [ "$FIRST_FAILED_RUN" -ne 0 ]; then
            EXCERPT="${LOG_DIR}/excerpt.txt"
            FAIL_LOG="${LOG_DIR}/run-${FIRST_FAILED_RUN}.log"
            # From vitest's first `FAIL` line, or the tail of the log when the
            # run died before printing one (a crashed worker, a setup timeout).
            START="$(grep -n -m1 -E '(^|[[:space:]])FAIL([[:space:]]|$)' "$FAIL_LOG" | cut -d: -f1 || true)"
            if [ -n "$START" ]; then
              tail -n "+${START}" "$FAIL_LOG" | head -n 40 > "$EXCERPT"
            else
              tail -n 40 "$FAIL_LOG" > "$EXCERPT"
            fi
            # vitest colours its output even without a TTY here; strip the ANSI
            # escapes (and CRs) so the excerpt reads cleanly in the issue comment.
            sed -i -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r$//' "$EXCERPT"
          fi

          # --- The result, rendered once -------------------------------------
          # Written to a file rather than assembled twice: the job summary and
          # the issue comment (the `### Repro result` contract in
          # .kiro/specs/ci-flaky-test-detection design.md) must carry the same text, and the
          # routine parses `- Runs:` / `- Failed:` out of whichever it reads.
          RESULT_MD="${LOG_DIR}/result.md"
          {
            echo "### Repro result"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Mode: ${MODE}"
            echo "- Runs: ${RUNS}"
            echo "- Failed: ${FAILED}"
            echo "- Per-run: ${PER_RUN}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            # `suite` mode runs the project's whole test script, and `test:integ`
            # is the script of BOTH integration projects. So a tally produced
            # from an `app-integration-exclusive` request also contains
            # `app-integration`'s result, which the reader of `- Mode: suite`
            # cannot tell on its own. Written as its own paragraph after the
            # fixed `- Key: value` lines so that their order — the part the
            # routine reads — stays uninterrupted.
            if [ "$MODE" = 'suite' ] && [ "$SUITE_SCRIPT" = 'test:integ' ]; then
              echo
              echo "Note: \`suite\` mode ran \`pnpm run test:integ\` once, which covers both \`app-integration\` and \`app-integration-exclusive\` — a failure counted here may come from either project."
            fi
            if [ -n "$EXCERPT" ]; then
              echo
              # Four backticks: GROWI's own specs carry Markdown fixtures, so a
              # three-backtick line inside the excerpt is not far-fetched.
              echo '````'
              cat "$EXCERPT"
              echo '````'
            fi
          } > "$RESULT_MD"

          cat "$RESULT_MD" >> "$GITHUB_STEP_SUMMARY"
          # Echo the same block to the job log so the tally can be read with
          # `gh run view --log` without opening the summary UI.
          cat "$RESULT_MD"

          {
            echo "runs=${RUNS}"
            echo "failed=${FAILED}"
            echo "per_run=${PER_RUN}"
            echo "first_failed_run=${FIRST_FAILED_RUN}"
            # Paths, not contents: `$GITHUB_OUTPUT` is a single-line key=value
            # file and the excerpt is up to 40 lines.
            echo "log_dir=${LOG_DIR}"
            echo "result_path=${RESULT_MD}"
            echo "excerpt_path=${EXCERPT}"
          } >> "$GITHUB_OUTPUT"

          # Failing tests are the answer this job exists to produce, so they
          # must not colour its conclusion. Only the steps before this one can
          # turn the job red.
          exit 0

      # Delivery, kept separate from the measurement above so that a problem
      # reaching GitHub can never be read as a problem taking the measurement.
      #
      # Skipped when the request named no issue (`Flaky-Repro-Issue` is
      # optional — the result then lives in the job summary alone), and, because
      # a failed step stops the ones after it, skipped as well when the
      # measurement itself gave up ("nothing was measured"): a rejected or
      # unmeasurable request must leave no comment behind.
      - name: Post the result to the tracking issue
        id: comment
        if: steps.request.outputs.requested == 'true' && steps.request.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.request.outputs.issue }}
          RESULT_PATH: ${{ steps.repro.outputs.result_path }}
        run: |
          set -euo pipefail

          # The body is `result.md` byte for byte — the same text the job
          # summary carries, because the measuring step renders it once for both
          # (the failing run's excerpt is already inside that file; appending it
          # here would print it twice).
          #
          # One comment per pushed commit: this step runs once per job and never
          # looks for an earlier comment to edit. Re-running the job by hand
          # leaves a second comment for the same commit, which the routine
          # tolerates by reading the newest one.
          RESPONSE="${RUNNER_TEMP}/comment-response.txt"

          # A failed POST must not fail the job. The routine reads this job's
          # conclusion as the answer to "was a measurement taken at all?", so
          # exiting non-zero because of a locked issue or a momentary GitHub
          # outage would make it discard a tally that was in fact produced, and
          # ask a human to decide instead. The failure is therefore reported the
          # way a human notices it — an annotation plus the job summary, which
          # already holds the full result — while the conclusion stays `success`.
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" \
               -X POST \
               -F "body=@${RESULT_PATH}" \
               --jq '.html_url' > "$RESPONSE" 2>&1; then
            {
              echo
              echo "Posted to issue #${ISSUE}: $(cat "$RESPONSE")"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              # Not `### Repro result`: that heading is the routine's anchor for
              # a measured tally, and this section is the opposite of one.
              echo "### Could not post the repro result to issue #${ISSUE}"
              echo
              echo "The measurement finished; only the comment failed. The result is above in this summary."
              echo
              echo '```'
              cat "$RESPONSE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::flaky-repro: could not post the result to issue #${ISSUE}; the tally is in the job summary"
          fi
