name: Release Docker Image for @growi/attachment-text-extractor

# Publishes the attachment-text-extractor image to Docker Hub.
#
# Trigger: a push to master that touches apps/attachment-text-extractor/package.json.
# The version in that file decides everything — the image is published only when
# that version is a stable one that has not been tagged yet, so a push that edits
# the manifest without releasing is a no-op.
#
# The version itself comes from changesets, the same way @growi/core and
# @growi/pluginkit are released: write a changeset naming @growi/attachment-text-extractor in
# the development PR, and merging the generated "Release Subpackages" PR bumps
# package.json and CHANGELOG.md on master. That merge is what publishes the image.
# There is no separate release branch and no RC version marker.
#
# Note: the "Supported tags" list in apps/attachment-text-extractor/docker/README.md is
# not managed by changesets. Update it in the PR that carries the changeset.
#
# What the published image must satisfy is checked on every push by
# ci-attachment-text-extractor.yml, on linux/amd64 and on linux/arm64.
#
# Secrets (already available in GitHub Actions):
#   - DOCKER_REGISTRY_PASSWORD_GROWIMOOGLE
#       Password/token for the `growimoogle` Docker Hub account, used to push
#       the built image to docker.io. Same secret used by release-vault.yml.

on:
  push:
    branches:
      - master
    paths:
      - apps/attachment-text-extractor/package.json
      - .github/workflows/release-attachment-text-extractor.yml
  # Manual re-run for recovery. Publishing stays gated on the check below, so a
  # dispatch on an already-released version does nothing.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  determine-release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.package-json.outputs.packageVersion }}
      should-release: ${{ steps.decide.outputs.should-release }}

    steps:
    - uses: actions/checkout@v4

    - name: Retrieve information from package.json
      uses: myrotvorets/info-from-package-json-action@v2.0.2
      id: package-json
      with:
        workingDir: apps/attachment-text-extractor

    - name: Decide whether this version needs publishing
      id: decide
      env:
        VERSION: ${{ steps.package-json.outputs.packageVersion }}
      run: bash .github/scripts/decide-release.sh "$VERSION" attachment-text-extractor


  build-and-push-image:
    needs: determine-release
    if: needs.determine-release.outputs.should-release == 'true'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: growilabs/attachment-text-extractor
        tags: |
          type=raw,value=latest
          type=semver,value=${{ needs.determine-release.outputs.version }},pattern={{major}}
          type=semver,value=${{ needs.determine-release.outputs.version }},pattern={{major}}.{{minor}}
          type=semver,value=${{ needs.determine-release.outputs.version }},pattern={{major}}.{{minor}}.{{patch}}

    - name: Login to docker.io registry (push target)
      uses: docker/login-action@v3
      with:
        username: growimoogle
        password: ${{ secrets.DOCKER_REGISTRY_PASSWORD_GROWIMOOGLE }}

    # QEMU is required to cross-build the linux/arm64 variant on an amd64 runner.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./apps/attachment-text-extractor/docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        builder: ${{ steps.buildx.outputs.name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: ${{ steps.meta.outputs.tags }}

    # Runs after the push so the tag always means "this version is on Docker Hub",
    # which is what determine-release relies on.
    - name: Add tag
      uses: anothrNick/github-tag-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CUSTOM_TAG: attachment-text-extractor/v${{ needs.determine-release.outputs.version }}
        VERBOSE: true

    - name: Update Docker Hub Description
      uses: peter-evans/dockerhub-description@v4
      with:
        username: growimoogle
        password: ${{ secrets.DOCKER_REGISTRY_PASSWORD_GROWIMOOGLE }}
        repository: growilabs/attachment-text-extractor
        readme-filepath: ./apps/attachment-text-extractor/docker/README.md
