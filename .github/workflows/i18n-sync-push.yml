name: Sync i18n source strings to POEditor (push)

# Pushes the en_US (source language) locale files to POEditor whenever they
# change on the default branch, so translators always work against the
# latest source strings (Requirement 2.1, 2.2).
#
# Trigger scope deliberately excludes pull_request: this workflow calls the
# real PushSourceSync CLI, which uploads to the live POEditor project via
# PoeditorClient.uploadTerms — it must never run against a PR head, since that
# would let any external contributor's unmerged content reach the live
# project. workflow_dispatch is not the same risk: it requires repo write
# access to trigger, the same trust level as pushing to master directly, and
# lets a maintainer re-run or verify the push path (e.g. after rotating
# POEDITOR_API_TOKEN) without needing to land a throwaway content change.

on:
  push:
    branches:
      - master
    paths:
      - apps/app/public/static/locales/en_US/**
      # Included so that a PR which only touches this workflow can still prove
      # its own change on merge, per this repo's existing convention (see
      # check-changesets.yml / release-pdf-converter.yml).
      - .github/workflows/i18n-sync-push.yml
  workflow_dispatch:

concurrency:
  # Scoped to the ref (always `refs/heads/master` here) rather than just the
  # workflow name, matching this repo's push-triggered-workflow convention
  # (see check-changesets.yml) — prevents two pushes to master in quick
  # succession from racing overlapping POEditor uploads. Safe to cancel an
  # in-flight run: push-source.ts always uploads the current en_US state in
  # full (idempotent overwrite, design.md Push Flow), so a superseding run
  # makes a cancelled one redundant, not incomplete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only reads the checkout and calls the POEditor API with
# POEDITOR_API_TOKEN; it never pushes, opens a PR, or otherwise writes to the
# repository, so the default GITHUB_TOKEN is scoped to read-only.
permissions:
  contents: read

jobs:
  i18n-sync-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push en_US source strings to POEditor
        working-directory: ./apps/app
        env:
          POEDITOR_API_TOKEN: ${{ secrets.POEDITOR_API_TOKEN }}
        run: pnpm run i18n:sync:push
