name: Python CI for attachment-text-extractor

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - release/**
      - rc/**
      - changeset-release/**
      - mergify/merge-queue/**
      - tmp-mergify/merge-queue/**
    paths:
      - services/attachment-text-extractor/**
      # The committed OpenAPI contract is compared with the service's export.
      - packages/attachment-text-extractor-client/openapi.json
      - infra/docker/compose.yaml
      - .github/workflows/attachment-text-extractor.yml
      # Node rewrite: the package and the root files that change how it is linted or resolved.
      - apps/attachment-text-extractor/**
      - biome.json
      - tsconfig.base.json
      - turbo.json
      - pnpm-lock.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeps the image small enough for the per-Pod memory budget (design.md, Deployment Checks).
  IMAGE_MAX_BYTES: '400000000'
  IMAGE_TAG: attachment-text-extractor:ci
  CONTAINER_NAME: ate-smoke

jobs:
  # Runs beside the Python job until the Python version is removed. ci-app.yml selects
  # ./packages/* and @growi/app only, so it does not run this package's tests a second time.
  ci-attachment-text-extractor-node:
    name: Node CI for attachment-text-extractor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm add turbo --global
          pnpm install --frozen-lockfile

      - name: Lint and test
        run: turbo run lint test --filter=@growi/attachment-text-extractor --env-mode=loose

  ci-attachment-text-extractor:
    name: Python CI for attachment-text-extractor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    defaults:
      run:
        working-directory: services/attachment-text-extractor

    steps:
      - uses: actions/checkout@v4

      # Same uv version as the Dockerfile pin, so CI and the image resolve alike.
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          enable-cache: true
          cache-dependency-glob: services/attachment-text-extractor/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

      - name: Build image
        run: docker build -t "$IMAGE_TAG" .

      - name: Check image size
        run: |
          size=$(docker image inspect "$IMAGE_TAG" --format '{{.Size}}')
          echo "image size: ${size} bytes (limit ${IMAGE_MAX_BYTES})"
          test "$size" -le "$IMAGE_MAX_BYTES"

      # No published port exists with --network none, so the checks below run inside the container.
      - name: Start container (read-only rootfs, uid 10001, no network)
        run: |
          token=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          docker run -d --name "$CONTAINER_NAME" --init --read-only --user 10001:10001 --network none \
            --tmpfs /tmp:rw,size=64m,mode=1777 \
            -e ATTACHMENT_EXTRACTOR_SERVICE_TOKEN="$token" \
            "$IMAGE_TAG"

      - name: Check readiness
        run: |
          for attempt in $(seq 1 30); do
            if docker exec -i "$CONTAINER_NAME" python -c "$(cat scripts/smoke_extract.py)" readyz; then
              exit 0
            fi
            sleep 2
          done
          echo "container did not become ready" >&2
          exit 1

      - name: Generate sample files
        run: uv run python scripts/smoke_extract.py generate --out-dir "$RUNNER_TEMP/smoke"

      - name: Extract PDF and DOCX through the container
        run: |
          docker exec -i "$CONTAINER_NAME" python -c "$(cat scripts/smoke_extract.py)" extract \
            --filename sample.pdf --mime application/pdf --expect "Smoke PDF marker" \
            < "$RUNNER_TEMP/smoke/sample.pdf"
          docker exec -i "$CONTAINER_NAME" python -c "$(cat scripts/smoke_extract.py)" extract \
            --filename sample.docx --mime application/vnd.openxmlformats-officedocument.wordprocessingml.document \
            --expect "Smoke DOCX marker" \
            < "$RUNNER_TEMP/smoke/sample.docx"

      - name: Show container logs on failure
        if: failure()
        run: docker logs "$CONTAINER_NAME" || true

      - name: Remove container
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true

      - name: Export OpenAPI
        run: uv run python scripts/export_openapi.py --output "$RUNNER_TEMP/openapi.json"

      - name: Check OpenAPI drift
        run: uv run python scripts/check_openapi_drift.py "$RUNNER_TEMP/openapi.json" ../../packages/attachment-text-extractor-client/openapi.json
