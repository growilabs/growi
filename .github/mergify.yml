queue_rules:
  - name: default
    queue_conditions:
      - check-success ~= ci-app-lint
      - check-success ~= ci-app-test
      - check-success ~= ci-app-launch-dev
      - -check-failure ~= ci-app-
      - -check-failure ~= ci-slackbot-
      - -check-failure ~= test-prod-node24 /
      - -check-failure ~= test-prod-node24 / build-prod
      - -check-failure ~= test-prod-node24 / launch-prod
      - -check-failure ~= test-prod-node24 / run-playwright
      - -check-failure ~= test-prod-node24 / report-playwright
    merge_conditions:
      - check-success ~= ci-app-lint
      - check-success ~= ci-app-test
      - check-success ~= ci-app-launch-dev
      - check-success = test-prod-node24 / build-prod
      - check-success ~= test-prod-node24 / launch-prod
      # Gate on report-playwright (not individual run-playwright shards).
      # report-playwright runs after ALL shards complete (needs: [run-playwright])
      # and fails if any shard did not succeed (including cancelled), so a single
      # SUCCESS here guarantees every playwright matrix job passed — no race condition.
      - check-success = test-prod-node24 / report-playwright
      - -check-failure ~= ci-app-
      - -check-failure ~= ci-slackbot-
      - -check-failure ~= test-prod-node24 /
      - -check-failure ~= test-prod-node24 / build-prod
      - -check-failure ~= test-prod-node24 / launch-prod
      - -check-failure ~= test-prod-node24 / run-playwright
      - -check-failure ~= test-prod-node24 / report-playwright

  # Content-only pull requests from the i18n sync bot (translation-only
  # branch, see pull-translations.ts's TRANSLATION_ONLY_BRANCH): the diff is
  # always a subset of `apps/app/public/static/locales/**` values already
  # validated by `pnpm run lint:i18n` inside the pull workflow before this
  # pull request was even opened (Requirement 3.3/3.4), so the full app
  # test/build/Playwright matrix verifies nothing this diff could break.
  # ci-app-lint alone still catches a malformed-JSON regression.
  - name: i18n-sync-translation-only
    queue_conditions:
      - check-success ~= ci-app-lint
      - -check-failure ~= ci-app-lint
    merge_conditions:
      - check-success ~= ci-app-lint
      - -check-failure ~= ci-app-lint

pull_request_rules:
  - name: Automatic queue to merge
    conditions:
      - '#approved-reviews-by >= 1'
      - '#changes-requested-reviews-by = 0'
      - '#review-requested = 0'
      # Routed to the lightweight queue below instead.
      - -head = i18n-sync/translation-only
    actions:
      queue:

  - name: Automatic queue to merge (i18n-sync translation-only)
    conditions:
      - head = i18n-sync/translation-only
      - '#approved-reviews-by >= 1'
      - '#changes-requested-reviews-by = 0'
      - '#review-requested = 0'
    actions:
      queue:
        name: i18n-sync-translation-only

  - name: Automatic merge for Preparing next version
    conditions:
      - author = github-actions[bot]
      - label = type/prepare-next-version
    actions:
      merge:
        method: merge
